name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # macOS jobs keep the bare name the required status checks match.
    name: Python ${{ matrix.python-version }}${{ matrix.os == 'ubuntu-latest' && ' (Linux)' || '' }}
    # Reviewer source tools run inside the platform sandbox (Seatbelt on macOS,
    # bubblewrap on Linux), so the suite needs runners that can enforce it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out pr-council-mcp
        uses: actions/checkout@v4
        with:
          path: pr-council-mcp

      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3 libseccomp2 libc-bin file git
          # The disposable runner must permit the user namespaces the sandbox needs.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
        working-directory: pr-council-mcp

      - name: Sync dependencies (locked)
        run: uv sync --frozen --python ${{ matrix.python-version }}
        working-directory: pr-council-mcp

      # Mirrors `make ci`: ruff format --check, ruff check, mypy --strict,
      # and pytest with branch coverage (fail-under 80).
      - name: Run checks
        run: make ci
        working-directory: pr-council-mcp

      - name: Upload coverage report
        if: matrix.os == 'macos-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: pr-council-mcp/coverage.xml
          if-no-files-found: error

      - name: Generate coverage badge
        if: matrix.os == 'macos-latest' && matrix.python-version == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: uv run python scripts/coverage_badge.py coverage.xml pages/coverage.svg
        working-directory: pr-council-mcp

      - name: Upload GitHub Pages artifact
        if: matrix.os == 'macos-latest' && matrix.python-version == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pr-council-mcp/pages

  deploy_coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy coverage badge
        id: deployment
        uses: actions/deploy-pages@v4
