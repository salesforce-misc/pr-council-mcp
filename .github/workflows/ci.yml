name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # macOS-only: reviewer source tools run inside the macOS Seatbelt sandbox
    # (`sandbox-exec`), so the sandbox test suite requires a macOS runner.
    runs-on: macos-latest
    steps:
      - name: Check out pr-council-mcp
        uses: actions/checkout@v4
        with:
          path: pr-council-mcp

      - name: Check out localmcplib
        uses: actions/checkout@v4
        with:
          repository: salesforce-misc/localmcplib
          ref: ad4e0617711e09f863ed00428241d4b16d78782a
          path: localmcplib

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12
        working-directory: pr-council-mcp

      - name: Sync dependencies (locked)
        run: uv sync --frozen
        working-directory: pr-council-mcp

      # Mirrors `make ci`: ruff format --check, ruff check, mypy --strict,
      # and pytest with branch coverage (fail-under 80).
      - name: Run checks
        run: make ci
        working-directory: pr-council-mcp

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: pr-council-mcp/coverage.xml
          if-no-files-found: error

      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: uv run python scripts/coverage_badge.py coverage.xml pages/coverage.svg
        working-directory: pr-council-mcp

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pr-council-mcp/pages

  deploy_coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy coverage badge
        id: deployment
        uses: actions/deploy-pages@v4
